{% extends "base.html" %}{% block title %}Daftar{% endblock %}
{% block content %}<div class="auth-wrap"><div class="auth-aside"><div class="eyebrow">JOIN THE CLUB</div><h1>Mulai dari <span>sekarang.</span></h1><p>Buat akun dan jelajahi semua fitur reward demo mr cont.</p><div class="auth-art">m<span>.</span></div></div><form class="auth-card" method="post"><input type="hidden" name="_csrf" value="{{ csrf_token() }}"><div class="eyebrow">BUAT AKUN</div><h2>Daftar gratis</h2><p class="muted">Hanya butuh beberapa detail.</p><label>Username</label><input name="username" required minlength="3" maxlength="24" pattern="[A-Za-z0-9_]+" autocomplete="username" placeholder="misal: han_gaming"><label>Kata sandi</label><input type="password" name="password" required minlength="8" autocomplete="new-password" placeholder="Minimal 8 karakter"><label>Kode referral <span class="optional">opsional</span></label><input name="ref" value="{{ ref or '' }}" maxlength="16" placeholder="Kode teman"><button class="btn primary full" type="submit">Buat akun <span>→</span></button><p class="auth-switch">Sudah terdaftar? <a href="{{ url_for('login') }}">Masuk</a></p></form></div>{% endblock %}
